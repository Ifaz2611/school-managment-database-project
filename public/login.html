<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Manager - Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>School Manager</h1>
        <p>Sign in to manage your students</p>
      </div>


      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active">Sign In</button>
        <button id="tab-register" class="auth-tab">Sign Up</button>
      </div>


      <form id="login-form" class="auth-form active-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required />
        </div>
        <div class="form-error" id="login-error"></div>
        <button type="submit" class="btn-primary">Sign In</button>
      </form>


      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="reg-username">Username</label>
          <input type="text" id="reg-username" required />
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" required />
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" required />
        </div>
        <div class="form-error" id="register-error"></div>
        <button type="submit" class="btn-primary">Create Account</button>
      </form>
    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
