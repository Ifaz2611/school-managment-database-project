<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Manager - Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="navbar-brand">School Manager</div>
    <div class="navbar-right">
      <span id="user-display" class="navbar-user"></span>
      <button id="logout-btn" class="btn-ghost">Logout</button>
    </div>
  </header>


  <main class="dashboard">
    <div class="card">
      <div class="card-header">
        <h2 id="form-title">Add Student</h2>
      </div>
      <form id="student-form" class="student-form">
        <input type="hidden" id="student-id" />
        <div class="form-row">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required />
          </div>
          <div class="form-group">
            <label for="roll">Roll Number</label>
            <input type="text" id="roll" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="class">Class</label>
            <input type="text" id="class" required />
          </div>
          <div class="form-group">
            <label for="section">Section</label>
            <input type="text" id="section" required />
          </div>
        </div>
        <div class="form-error" id="student-error"></div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="submit-btn">Add Student</button>
          <button type="button" class="btn-ghost" id="cancel-btn" style="display:none">Cancel</button>
        </div>
      </form>
    </div>


    <div class="card">
      <div class="card-header">
        <h2>Student Records</h2>
        <input type="text" id="search" placeholder="Search by name or roll..." class="search-input" />
      </div>
      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Roll</th>
              <th>Class</th>
              <th>Section</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="students-body"></tbody>
        </table>
        <div id="empty-state" class="empty-state hidden">No students yet. Add one above.</div>
      </div>
    </div>
  </main>
  <script src="dashboard.js"></script>
</body>
</html>
