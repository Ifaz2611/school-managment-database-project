<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Manager - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eef2ff',
                100: '#e0e7ff',
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
                900: '#1e1b4b',
              },
            },
            animation: {
              'spin-slow': 'spin 2s linear infinite',
              'fade-in': 'fadeIn 0.3s ease-in-out',
              'slide-up': 'slideUp 0.3s ease-out',
              'slide-down': 'slideDown 0.3s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(10px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              slideDown: {
                '0%': { transform: 'translateY(-10px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
            },
          },
        },
      };
    </script>
    <style>
      .text-gradient {
        background: linear-gradient(to right, #6366f1, #8b5cf6);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .shadow-soft {
        box-shadow: 0 2px 15px -3px rgba(0, 0, 0, 0.07), 0 10px 20px -2px rgba(0, 0, 0, 0.04);
      }
      .shadow-glow {
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
      }
      .modal-overlay {
        display: none;
        align-items: center;
        justify-content: center;
      }
      .modal-overlay.active {
        display: flex;
      }
      .modal-in {
        animation: slideUp 0.3s ease-out;
      }
      .toast {
        animation: slideDown 0.3s ease-out;
      }
    </style>
  </head>

  <body
    class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-sans antialiased min-h-screen"
  >
    <!-- Toast container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2 w-80"></div>

    <!-- Header -->
    <header
      class="sticky top-0 z-40 bg-white/80 dark:bg-gray-900/70 backdrop-blur-xl border-b border-gray-200/60 dark:border-gray-800"
    >
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center"
      >
        <div class="flex items-center space-x-3">
          <div
            class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-500 to-violet-600 flex items-center justify-center text-white font-extrabold shadow-md shadow-brand-500/30"
          >
            S
          </div>
          <h1 class="text-lg font-extrabold text-gradient">School Management</h1>
        </div>
        <div class="flex items-center space-x-3">
          <div
            class="hidden sm:flex items-center space-x-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-full pl-1 pr-3 py-1"
          >
            <div
              id="user-avatar"
              class="w-7 h-7 rounded-full bg-brand-100 dark:bg-brand-900 text-brand-700 dark:text-brand-300 flex items-center justify-center text-xs font-bold"
            >
              U
            </div>
            <span
              id="user-display"
              class="text-sm font-medium text-gray-600 dark:text-gray-300"
            ></span>
          </div>
          <button
            id="logout-btn"
            class="px-4 py-2 text-sm font-semibold text-white bg-gradient-to-r from-brand-600 to-violet-600 hover:from-brand-500 hover:to-violet-500 rounded-xl shadow-md shadow-brand-500/20 transition-all duration-200"
          >
            Logout
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <!-- Stats -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
        <div
          class="flex items-center gap-4 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl shadow-soft p-5 hover:shadow-glow transition-shadow duration-300"
        >
          <div
            class="w-11 h-11 rounded-xl bg-brand-100 dark:bg-brand-900 text-brand-600 dark:text-brand-300 flex items-center justify-center"
          >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
          </div>
          <div>
            <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
              Total Students
            </p>
            <p id="stat-students" class="text-2xl font-extrabold">0</p>
          </div>
        </div>
        <div
          class="flex items-center gap-4 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl shadow-soft p-5 hover:shadow-glow transition-shadow duration-300"
        >
          <div
            class="w-11 h-11 rounded-xl bg-violet-100 dark:bg-violet-900 text-violet-600 dark:text-violet-300 flex items-center justify-center"
          >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
          </div>
          <div>
            <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
              Classes
            </p>
            <p id="stat-classes" class="text-2xl font-extrabold">0</p>
          </div>
        </div>
        <div
          class="flex items-center gap-4 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl shadow-soft p-5 hover:shadow-glow transition-shadow duration-300"
        >
          <div
            class="w-11 h-11 rounded-xl bg-emerald-100 dark:bg-emerald-900 text-emerald-600 dark:text-emerald-300 flex items-center justify-center"
          >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
            </svg>
          </div>
          <div>
            <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
              Sections
            </p>
            <p id="stat-sections" class="text-2xl font-extrabold">0</p>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Student form -->
        <div
          class="lg:col-span-1 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl shadow-soft p-6 h-fit"
        >
          <div class="flex items-center justify-between mb-6">
            <h2
              id="form-title"
              class="text-lg font-bold text-gray-900 dark:text-white"
            >
              Add Student
            </h2>
            <span
              id="form-badge"
              class="hidden px-2.5 py-1 text-xs font-semibold rounded-full bg-brand-100 dark:bg-brand-900 text-brand-700 dark:text-brand-300"
            >
              Editing
            </span>
          </div>
          <form id="student-form" class="space-y-4">
            <input type="hidden" id="student-id" />
            <div>
              <label
                for="name"
                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                >Full Name</label
              >
              <input
                type="text"
                id="name"
                required
                class="form-input block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded-xl shadow-sm placeholder-gray-400 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 sm:text-sm"
                placeholder="e.g. Alice Johnson"
              />
            </div>
            <div>
              <label
                for="roll"
                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                >Roll Number</label
              >
              <input
                type="text"
                id="roll"
                required
                class="form-input block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded-xl shadow-sm placeholder-gray-400 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 sm:text-sm"
                placeholder="e.g. 101"
              />
            </div>
            <div>
              <label
                for="class"
                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                >Class</label
              >
              <input
                type="text"
                id="class"
                required
                class="form-input block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded-xl shadow-sm placeholder-gray-400 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 sm:text-sm"
                placeholder="e.g. 10"
              />
            </div>
            <div>
              <label
                for="section"
                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                >Section</label
              >
              <input
                type="text"
                id="section"
                required
                class="form-input block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded-xl shadow-sm placeholder-gray-400 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 sm:text-sm"
                placeholder="e.g. A"
              />
            </div>
            <div
              id="student-error"
              class="hidden text-sm text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-800 rounded-lg px-3 py-2"
            ></div>
            <div class="flex items-center space-x-3 pt-2">
              <button
                type="submit"
                id="submit-btn"
                class="flex-1 px-4 py-2.5 text-sm font-semibold text-white bg-gradient-to-r from-brand-600 to-violet-600 hover:from-brand-500 hover:to-violet-500 rounded-xl shadow-md shadow-brand-500/20 transition-all duration-200 flex items-center justify-center gap-2"
              >
                <span id="submit-text">Add Student</span>
                <span id="submit-spinner" class="hidden">
                  <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                  </svg>
                </span>
              </button>
              <button
                type="button"
                id="cancel-btn"
                class="px-4 py-2.5 text-sm font-semibold text-gray-700 dark:text-gray-200 bg-gray-100 dark:bg-gray-700 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-600 transition-all duration-200 hidden"
              >
                Cancel
              </button>
            </div>
          </form>
        </div>

        <!-- Student records table -->
        <div
          class="lg:col-span-2 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl shadow-soft overflow-hidden"
        >
          <div
            class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 p-6 pb-4"
          >
            <h2 class="text-lg font-bold text-gray-900 dark:text-white">
              Student Records
            </h2>
            <div class="relative w-full sm:max-w-xs">
              <svg
                class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                />
              </svg>
              <input
                type="text"
                id="search"
                placeholder="Search name or roll..."
                class="form-input w-full pl-9 pr-3 py-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded-xl shadow-sm placeholder-gray-400 dark:placeholder-gray-400 focus:outline-none sm:text-sm"
              />
            </div>
          </div>

          <div class="overflow-x-auto">
            <table
              class="min-w-full divide-y divide-gray-200 dark:divide-gray-700"
            >
              <thead class="bg-gray-50 dark:bg-gray-800/60">
                <tr>
                  <th
                    scope="col"
                    class="px-6 py-3 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                  >
                    Name
                  </th>
                  <th
                    scope="col"
                    class="px-6 py-3 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                  >
                    Roll
                  </th>
                  <th
                    scope="col"
                    class="px-6 py-3 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                  >
                    Class
                  </th>
                  <th
                    scope="col"
                    class="px-6 py-3 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                  >
                    Section
                  </th>
                  <th scope="col" class="relative px-6 py-3">
                    <span class="sr-only">Actions</span>
                  </th>
                </tr>
              </thead>
              <tbody
                id="students-body"
                class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700"
              ></tbody>
            </table>
            <div
              id="empty-state"
              class="hidden flex-col items-center justify-center py-12 text-center px-6"
            >
              <div
                class="w-16 h-16 rounded-2xl bg-gray-100 dark:bg-gray-700 flex items-center justify-center mb-4"
              >
                <svg
                  class="w-8 h-8 text-gray-400"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                </svg>
              </div>
              <p
                id="empty-text"
                class="text-gray-500 dark:text-gray-400 font-medium"
              >
                No students yet. Add one to get started.
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Delete confirmation modal -->
    <div
      id="delete-modal"
      class="modal-overlay fixed inset-0 z-50 p-4"
      aria-hidden="true"
    >
      <div
        id="delete-backdrop"
        class="absolute inset-0 bg-gray-900/50 backdrop-blur-sm"
      ></div>
      <div
        class="relative bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 max-w-sm w-full modal-in"
      >
        <div
          class="w-12 h-12 rounded-2xl bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-400 flex items-center justify-center mb-4"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            />
          </svg>
        </div>
        <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-2">
          Delete this student?
        </h3>
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">
          This action is permanent and cannot be undone.
        </p>
        <div class="flex justify-end space-x-3">
          <button
            id="delete-cancel-btn"
            class="px-4 py-2 text-sm font-semibold text-gray-700 dark:text-gray-200 bg-gray-100 dark:bg-gray-700 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-600 transition-all duration-200"
          >
            Cancel
          </button>
          <button
            id="delete-confirm-btn"
            class="px-4 py-2 text-sm font-semibold text-white bg-red-600 hover:bg-red-500 rounded-xl shadow-md shadow-red-500/20 transition-all duration-200 flex items-center justify-center gap-2"
          >
            <span id="delete-confirm-text">Delete</span>
            <span id="delete-spinner" class="hidden">
              <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            </span>
          </button>
        </div>
      </div>
    </div>

    <script>
      // --- User Display Logic ---
      // Simulate user data (replace with actual user data from backend)
      const userDisplay = document.getElementById('user-display');
      const userAvatar = document.getElementById('user-avatar');
      const storedUser = localStorage.getItem('schoolManagerUser');

      if (storedUser) {
        const user = JSON.parse(storedUser);
        userDisplay.textContent = user.username || 'User';
        userAvatar.textContent = (user.username || 'U').charAt(0).toUpperCase();
      } else {
        userDisplay.textContent = 'User';
        userAvatar.textContent = 'U';
      }

      // --- Logout Logic ---
      const logoutBtn = document.getElementById('logout-btn');
      logoutBtn.addEventListener('click', async () => {
        // Attempt server-side logout to destroy session cookie
        try {
          await fetch('/api/logout', { method: 'POST' });
        } catch (e) {
          // ignore network errors
        }
        // Clear client-side state and navigate to login
        localStorage.removeItem('schoolManagerUser');
        window.location.href = '/login.html'; // Redirect to login page
      });

      // --- Toast Notification System ---
      const toastContainer = document.getElementById('toast-container');

      function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        toast.classList.add('toast', 'p-4', 'rounded-xl', 'shadow-md', 'flex', 'items-center', 'gap-3');

        if (type === 'success') {
          toast.classList.add('bg-emerald-50', 'dark:bg-emerald-900/30', 'border', 'border-emerald-100', 'dark:border-emerald-800');
          toast.innerHTML = `
            <svg class="w-5 h-5 text-emerald-600 dark:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            <p class="text-sm font-medium text-emerald-700 dark:text-emerald-300">${message}</p>
          `;
        } else if (type === 'error') {
          toast.classList.add('bg-red-50', 'dark:bg-red-900/30', 'border', 'border-red-100', 'dark:border-red-800');
          toast.innerHTML = `
            <svg class="w-5 h-5 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <p class="text-sm font-medium text-red-700 dark:text-red-300">${message}</p>
          `;
        }

        toastContainer.appendChild(toast);

        // Remove toast after 3 seconds
        setTimeout(() => {
          toast.classList.add('opacity-0', 'transition-opacity', 'duration-300');
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      // --- Student Form Logic ---
      const studentForm = document.getElementById('student-form');
      const formTitle = document.getElementById('form-title');
      const formBadge = document.getElementById('form-badge');
      const submitBtn = document.getElementById('submit-btn');
      const submitText = document.getElementById('submit-text');
      const submitSpinner = document.getElementById('submit-spinner');
      const cancelBtn = document.getElementById('cancel-btn');
      const studentError = document.getElementById('student-error');
      const studentsBody = document.getElementById('students-body');
      const emptyState = document.getElementById('empty-state');
      const statStudents = document.getElementById('stat-students');
      const statClasses = document.getElementById('stat-classes');
      const statSections = document.getElementById('stat-sections');

      let students = JSON.parse(localStorage.getItem('students')) || [];
      let editingId = null;

      // Render student records
      function renderStudents(filter = '') {
        if (students.length === 0) {
          emptyState.classList.remove('hidden');
          return;
        } else {
          emptyState.classList.add('hidden');
        }

        studentsBody.innerHTML = '';
        const filteredStudents = students.filter(student =>
          student.name.toLowerCase().includes(filter.toLowerCase()) ||
          student.roll.toLowerCase().includes(filter.toLowerCase())
        );

        filteredStudents.forEach(student => {
          const row = document.createElement('tr');
          row.classList.add('transition-all', 'duration-200', 'hover:bg-gray-50', 'dark:hover:bg-gray-800/60');
          row.innerHTML = `
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 dark:text-white">${student.name}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">${student.roll}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">${student.class}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">${student.section}</td>
            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
              <button
                onclick="editStudent(${student.id})"
                class="text-brand-600 dark:text-brand-400 hover:text-brand-500 dark:hover:text-brand-300 transition-colors"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
              </button>
              <button
                onclick="confirmDelete(${student.id})"
                class="ml-3 text-red-600 dark:text-red-400 hover:text-red-500 dark:hover:text-red-300 transition-colors"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </td>
          `;
          studentsBody.appendChild(row);
        });

        // Update stats
        updateStats();
      }

      // Update stats
      function updateStats() {
        statStudents.textContent = students.length;

        // Count unique classes and sections
        const classes = new Set(students.map(student => student.class));
        const sections = new Set(students.map(student => student.section));

        statClasses.textContent = classes.size;
        statSections.textContent = sections.size;
      }

      // Add or update student
      studentForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const roll = document.getElementById('roll').value.trim();
        const studentClass = document.getElementById('class').value.trim();
        const section = document.getElementById('section').value.trim();

        // Validate inputs
        if (!name || !roll || !studentClass || !section) {
          studentError.textContent = 'All fields are required.';
          studentError.classList.remove('hidden');
          return;
        }

        studentError.classList.add('hidden');

        // Simulate loading state
        submitBtn.disabled = true;
        submitText.classList.add('hidden');
        submitSpinner.classList.remove('hidden');

        // Simulate API call
        setTimeout(() => {
          if (editingId !== null) {
            // Update existing student
            const index = students.findIndex(student => student.id === editingId);
            students[index] = { id: editingId, name, roll, class: studentClass, section };
            showToast('Student updated successfully!');
          } else {
            // Add new student
            const newStudent = {
              id: Date.now(),
              name,
              roll,
              class: studentClass,
              section
            };
            students.push(newStudent);
            showToast('Student added successfully!');
          }

          // Save to localStorage
          localStorage.setItem('students', JSON.stringify(students));

          // Reset form
          studentForm.reset();
          submitBtn.disabled = false;
          submitText.classList.remove('hidden');
          submitSpinner.classList.add('hidden');
          formTitle.textContent = 'Add Student';
          formBadge.classList.add('hidden');
          cancelBtn.classList.add('hidden');
          editingId = null;

          // Re-render students
          renderStudents(document.getElementById('search').value);
        }, 1000);
      });

      // Cancel edit
      cancelBtn.addEventListener('click', () => {
        studentForm.reset();
        formTitle.textContent = 'Add Student';
        formBadge.classList.add('hidden');
        cancelBtn.classList.add('hidden');
        editingId = null;
        studentError.classList.add('hidden');
      });

      // Edit student
      function editStudent(id) {
        const student = students.find(student => student.id === id);
        if (!student) return;

        document.getElementById('name').value = student.name;
        document.getElementById('roll').value = student.roll;
        document.getElementById('class').value = student.class;
        document.getElementById('section').value = student.section;
        document.getElementById('student-id').value = student.id;

        formTitle.textContent = 'Edit Student';
        formBadge.classList.remove('hidden');
        cancelBtn.classList.remove('hidden');
        editingId = id;

        // Scroll to form
        document.getElementById('student-form').scrollIntoView({ behavior: 'smooth' });
      }

      // --- Delete Modal Logic ---
      const deleteModal = document.getElementById('delete-modal');
      const deleteBackdrop = document.getElementById('delete-backdrop');
      const deleteCancelBtn = document.getElementById('delete-cancel-btn');
      const deleteConfirmBtn = document.getElementById('delete-confirm-btn');
      const deleteConfirmText = document.getElementById('delete-confirm-text');
      const deleteSpinner = document.getElementById('delete-spinner');

      let deleteId = null;

      function confirmDelete(id) {
        deleteId = id;
        deleteModal.classList.add('active');
      }

      function closeDeleteModal() {
        deleteModal.classList.remove('active');
        deleteId = null;
      }

      deleteBackdrop.addEventListener('click', closeDeleteModal);
      deleteCancelBtn.addEventListener('click', closeDeleteModal);

      deleteConfirmBtn.addEventListener('click', () => {
        if (deleteId === null) return;

        // Simulate loading state
        deleteConfirmBtn.disabled = true;
        deleteConfirmText.classList.add('hidden');
        deleteSpinner.classList.remove('hidden');

        // Simulate API call
        setTimeout(() => {
          students = students.filter(student => student.id !== deleteId);
          localStorage.setItem('students', JSON.stringify(students));

          // Reset modal
          deleteConfirmBtn.disabled = false;
          deleteConfirmText.classList.remove('hidden');
          deleteSpinner.classList.add('hidden');
          closeDeleteModal();

          // Re-render students
          renderStudents(document.getElementById('search').value);
          showToast('Student deleted successfully!');
        }, 1000);
      });

      // --- Search Logic ---
      const searchInput = document.getElementById('search');
      searchInput.addEventListener('input', () => {
        renderStudents(searchInput.value);
      });

      // --- Initialize ---
      renderStudents();
    </script>
  </body>
</html>
