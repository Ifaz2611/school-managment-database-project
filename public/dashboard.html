<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Manager - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind-config.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-sans antialiased min-h-screen"
  >
    <div id="toast-container"></div>

    <!-- Header -->
    <header
      class="sticky top-0 z-40 bg-white/80 dark:bg-gray-900/70 backdrop-blur-xl border-b border-gray-200/60 dark:border-gray-800"
    >
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center"
      >
        <div class="flex items-center space-x-3">
          <div
            class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-500 to-violet-600 flex items-center justify-center text-white font-extrabold shadow-md shadow-brand-500/30"
          >
            S
          </div>
          <h1 class="text-lg font-extrabold text-gradient">School Management</h1>
        </div>
        <div class="flex items-center space-x-3">
          <div
            class="hidden sm:flex items-center space-x-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-full pl-1 pr-3 py-1"
          >
            <div
              id="user-avatar"
              class="w-7 h-7 rounded-full bg-brand-100 dark:bg-brand-900 text-brand-700 dark:text-brand-300 flex items-center justify-center text-xs font-bold"
            >
              U
            </div>
            <span
              id="user-display"
              class="text-sm font-medium text-gray-600 dark:text-gray-300"
            ></span>
          </div>
          <button
            id="theme-toggle"
            type="button"
            aria-label="Toggle theme"
            class="text-gray-500 dark:text-gray-400 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-brand-500/30 rounded-xl text-sm p-2.5 transition"
          >
            <svg
              id="theme-toggle-dark-icon"
              class="hidden w-5 h-5"
              fill="currentColor"
              viewBox="0 0 20 20"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"
              ></path>
            </svg>
            <svg
              id="theme-toggle-light-icon"
              class="hidden w-5 h-5"
              fill="currentColor"
              viewBox="0 0 20 20"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.121-3.536a1 1 0 011.414 0l.707.707a1 1 0 01-1.414 1.414l-.707-.707a1 1 0 010-1.414zM4.95 16.05l-.707.707a1 1 0 001.414 1.414l.707-.707a1 1 0 00-1.414-1.414zm-2.121-3.536a1 1 0 010 1.414l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 0zM10 16a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1z"
                fill-rule="evenodd"
                clip-rule="evenodd"
              ></path>
            </svg>
          </button>
          <button
            id="logout-btn"
            class="px-4 py-2 text-sm font-semibold text-white bg-gradient-to-r from-brand-600 to-violet-600 hover:from-brand-500 hover:to-violet-500 rounded-xl shadow-md shadow-brand-500/20 transition-all duration-200"
          >
            Logout
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <!-- Stats -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
        <div
          class="flex items-center gap-4 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl shadow-soft p-5 hover:shadow-glow transition-shadow duration-300"
        >
          <div
            class="w-11 h-11 rounded-xl bg-brand-100 dark:bg-brand-900 text-brand-600 dark:text-brand-300 flex items-center justify-center"
          >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
          </div>
          <div>
            <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
              Total Students
            </p>
            <p id="stat-students" class="text-2xl font-extrabold">0</p>
          </div>
        </div>
        <div
          class="flex items-center gap-4 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl shadow-soft p-5 hover:shadow-glow transition-shadow duration-300"
        >
          <div
            class="w-11 h-11 rounded-xl bg-violet-100 dark:bg-violet-900 text-violet-600 dark:text-violet-300 flex items-center justify-center"
          >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
          </div>
          <div>
            <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
              Classes
            </p>
            <p id="stat-classes" class="text-2xl font-extrabold">0</p>
          </div>
        </div>
        <div
          class="flex items-center gap-4 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl shadow-soft p-5 hover:shadow-glow transition-shadow duration-300"
        >
          <div
            class="w-11 h-11 rounded-xl bg-emerald-100 dark:bg-emerald-900 text-emerald-600 dark:text-emerald-300 flex items-center justify-center"
          >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
            </svg>
          </div>
          <div>
            <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
              Sections
            </p>
            <p id="stat-sections" class="text-2xl font-extrabold">0</p>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Student form -->
        <div
          class="lg:col-span-1 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl shadow-soft p-6 h-fit"
        >
          <div class="flex items-center justify-between mb-6">
            <h2
              id="form-title"
              class="text-lg font-bold text-gray-900 dark:text-white"
            >
              Add Student
            </h2>
            <span
              id="form-badge"
              class="hidden px-2.5 py-1 text-xs font-semibold rounded-full bg-brand-100 dark:bg-brand-900 text-brand-700 dark:text-brand-300"
            >
              Editing
            </span>
          </div>
          <form id="student-form" class="space-y-4">
            <input type="hidden" id="student-id" />
            <div>
              <label
                for="name"
                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                >Full Name</label
              >
              <input
                type="text"
                id="name"
                required
                class="form-input block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded-xl shadow-sm placeholder-gray-400 dark:placeholder-gray-400 focus:outline-none sm:text-sm"
                placeholder="e.g. Alice Johnson"
              />
            </div>
            <div>
              <label
                for="roll"
                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                >Roll Number</label
              >
              <input
                type="text"
                id="roll"
                required
                class="form-input block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded-xl shadow-sm placeholder-gray-400 dark:placeholder-gray-400 focus:outline-none sm:text-sm"
                placeholder="e.g. 101"
              />
            </div>
            <div>
              <label
                for="class"
                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                >Class</label
              >
              <input
                type="text"
                id="class"
                required
                class="form-input block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded-xl shadow-sm placeholder-gray-400 dark:placeholder-gray-400 focus:outline-none sm:text-sm"
                placeholder="e.g. 10"
              />
            </div>
            <div>
              <label
                for="section"
                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                >Section</label
              >
              <input
                type="text"
                id="section"
                required
                class="form-input block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded-xl shadow-sm placeholder-gray-400 dark:placeholder-gray-400 focus:outline-none sm:text-sm"
                placeholder="e.g. A"
              />
            </div>
            <div
              id="student-error"
              class="hidden text-sm text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-800 rounded-lg px-3 py-2"
            ></div>
            <div class="flex items-center space-x-3 pt-2">
              <button
                type="submit"
                id="submit-btn"
                class="flex-1 px-4 py-2.5 text-sm font-semibold text-white bg-gradient-to-r from-brand-600 to-violet-600 hover:from-brand-500 hover:to-violet-500 rounded-xl shadow-md shadow-brand-500/20 transition-all duration-200"
              >
                Add Student
              </button>
              <button
                type="button"
                id="cancel-btn"
                class="px-4 py-2.5 text-sm font-semibold text-gray-700 dark:text-gray-200 bg-gray-100 dark:bg-gray-700 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-600 transition-all duration-200 hidden"
              >
                Cancel
              </button>
            </div>
          </form>
        </div>

        <!-- Student records table -->
        <div
          class="lg:col-span-2 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl shadow-soft overflow-hidden"
        >
          <div
            class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 p-6 pb-4"
          >
            <h2 class="text-lg font-bold text-gray-900 dark:text-white">
              Student Records
            </h2>
            <div class="relative w-full sm:max-w-xs">
              <svg
                class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                />
              </svg>
              <input
                type="text"
                id="search"
                placeholder="Search name or roll..."
                class="form-input w-full pl-9 pr-3 py-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded-xl shadow-sm placeholder-gray-400 dark:placeholder-gray-400 focus:outline-none sm:text-sm"
              />
            </div>
          </div>

          <div class="overflow-x-auto">
            <table
              class="min-w-full divide-y divide-gray-200 dark:divide-gray-700"
            >
              <thead class="bg-gray-50 dark:bg-gray-800/60">
                <tr>
                  <th
                    scope="col"
                    class="px-6 py-3 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                  >
                    Name
                  </th>
                  <th
                    scope="col"
                    class="px-6 py-3 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                  >
                    Roll
                  </th>
                  <th
                    scope="col"
                    class="px-6 py-3 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                  >
                    Class
                  </th>
                  <th
                    scope="col"
                    class="px-6 py-3 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                  >
                    Section
                  </th>
                  <th scope="col" class="relative px-6 py-3">
                    <span class="sr-only">Actions</span>
                  </th>
                </tr>
              </thead>
              <tbody
                id="students-body"
                class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700"
              ></tbody>
            </table>
            <div
              id="empty-state"
              class="hidden flex-col items-center justify-center py-12 text-center px-6"
            >
              <div
                class="w-16 h-16 rounded-2xl bg-gray-100 dark:bg-gray-700 flex items-center justify-center mb-4"
              >
                <svg
                  class="w-8 h-8 text-gray-400"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                </svg>
              </div>
              <p
                id="empty-text"
                class="text-gray-500 dark:text-gray-400 font-medium"
              >
                No students yet. Add one to get started.
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Delete confirmation modal -->
    <div
      id="delete-modal"
      class="modal-overlay fixed inset-0 z-50 items-center justify-center p-4"
      aria-hidden="true"
    >
      <div
        id="delete-backdrop"
        class="absolute inset-0 bg-gray-900/50 backdrop-blur-sm"
      ></div>
      <div
        class="relative bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 max-w-sm w-full modal-in"
      >
        <div
          class="w-12 h-12 rounded-2xl bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-400 flex items-center justify-center mb-4"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            />
          </svg>
        </div>
        <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-2">
          Delete this student?
        </h3>
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">
          This action is permanent and cannot be undone.
        </p>
        <div class="flex justify-end space-x-3">
          <button
            id="delete-cancel-btn"
            class="px-4 py-2 text-sm font-semibold text-gray-700 dark:text-gray-200 bg-gray-100 dark:bg-gray-700 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-600 transition-all duration-200"
          >
            Cancel
          </button>
          <button
            id="delete-confirm-btn"
            class="px-4 py-2 text-sm font-semibold text-white bg-red-600 hover:bg-red-500 rounded-xl shadow-md shadow-red-500/20 transition-all duration-200"
          >
            Delete
          </button>
        </div>
      </div>
    </div>

    <script src="dashboard.js"></script>
    <script src="theme.js"></script>
  </body>
</html>
